<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Underworld Claims You</title>
    <meta name="description" content="Your wisdom failed you. The Underworld awaits.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-destiny="underworld">
    <div class="key-border fixed-top"></div>
    <div id="destiny-scene" class="scene-canvas"></div>
    <div class="scene-loading" id="scene-loading">Awakening the realm&hellip;</div>
    <p id="message-index-data" hidden>{{ message_index }}</p>

    <div class="dialogue-overlay">
        <div class="dialogue-box">
            <h1 class="destiny-title">You Have Fallen</h1>
            <div class="speaker-name">Hades, Lord of the Underworld</div>
            <p class="dialogue-text" id="dialogue-text">{{ message }}</p>
            <div class="btn-row">
                <button type="button" id="hear-btn" class="audio-btn">🔊 Hear the God Speak</button>
            </div>
        </div>
        <a href="{{ url_for('home') }}" class="back-link">← Return to the Temple</a>
    </div>
    <span class="music-credit">Music: Holst &ndash; "Mars, the Bringer of War" (1914 rec., Skidmore College Orchestra) via Musopen</span>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="{{ url_for('static', filename='scene.js') }}"></script>
    <script src="{{ url_for('static', filename='dialogue.js') }}"></script>
    <script src="{{ url_for('static', filename='audio.js') }}"></script>
    <script src="{{ url_for('static', filename='atmosphere.js') }}"></script>
    <script src="{{ url_for('static', filename='destiny.js') }}"></script>
</body>
</html>
