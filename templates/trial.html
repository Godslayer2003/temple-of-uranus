<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trial of the Gods</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="trial-scene" class="scene-canvas"></div>

    <p id="riddle-data" hidden>{{ riddle }}</p>

    <div class="dialogue-overlay">
        <div class="dialogue-box">
            <div class="speaker-name">Zeus, Lord of Olympus</div>
            <p class="dialogue-text" id="dialogue-text">{{ riddle }}</p>
            <button type="button" id="hear-btn" class="audio-btn">🔊 Hear the God Speak</button>
        </div>

        <form method="POST" action="{{ url_for('trial_answer') }}" class="riddle-form">
            <input type="hidden" name="riddle_id" value="{{ riddle_id }}">
            {% for opt in options %}
                <button type="submit" name="answer" value="{{ opt }}" class="riddle-btn">{{ opt }}</button>
            {% endfor %}
        </form>

        <a href="{{ url_for('home') }}" class="back-link">← Flee back to the Temple</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="{{ url_for('static', filename='scene.js') }}"></script>
    <script src="{{ url_for('static', filename='dialogue.js') }}"></script>
    <script src="{{ url_for('static', filename='trial.js') }}"></script>
</body>
</html>
