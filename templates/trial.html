<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trial of the Gods</title>
    <meta name="description" content="Answer a god's riddle. Succeed and ascend to Olympus — fail, and the Underworld claims you.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="key-border fixed-top"></div>
    <div id="trial-scene" class="scene-canvas"></div>
    <div class="scene-loading" id="scene-loading">Awakening the realm&hellip;</div>

    <p id="riddle-data" hidden>{{ riddle }}</p>
    <p id="intro-data" hidden>{{ intro }}</p>
    <p id="presenter-data" hidden>{{ presenter_key }}</p>
    <p id="riddle-id-data" hidden>{{ riddle_id }}</p>
    <p id="intro-index-data" hidden>{{ intro_index }}</p>

    <div class="dialogue-overlay">
        <div class="dialogue-box">
            <div class="speaker-name">{{ presenter_name }}</div>
            <p class="dialogue-text" id="dialogue-text">{{ riddle }}</p>
            <div class="btn-row">
                <button type="button" id="hear-btn" class="audio-btn">🔊 Hear the God Speak</button>
            </div>
        </div>

        <form method="POST" action="{{ url_for('trial_answer') }}" class="riddle-form">
            <input type="hidden" name="riddle_id" value="{{ riddle_id }}">
            {% for opt in options %}
                <button type="submit" name="answer" value="{{ opt }}" class="riddle-btn">{{ opt }}</button>
            {% endfor %}
        </form>

        <a href="{{ url_for('home') }}" class="back-link">← Flee back to the Temple</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="{{ url_for('static', filename='scene.js') }}"></script>
    <script src="{{ url_for('static', filename='dialogue.js') }}"></script>
    <script src="{{ url_for('static', filename='audio.js') }}"></script>
    <script src="{{ url_for('static', filename='trial.js') }}"></script>
</body>
</html>
