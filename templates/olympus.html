<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus Awaits</title>
    <meta name="description" content="You answered wisely. Welcome to Olympus.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-destiny="olympus">
    <div id="destiny-scene" class="scene-canvas"></div>
    <div class="scene-loading" id="scene-loading">Awakening the realm&hellip;</div>

    <div class="dialogue-overlay">
        <div class="dialogue-box">
            <h1 class="destiny-title">You Have Ascended</h1>
            <div class="speaker-name">Zeus, Lord of Olympus</div>
            <p class="dialogue-text" id="dialogue-text">{{ message }}</p>
            <div class="btn-row">
                <button type="button" id="hear-btn" class="audio-btn">🔊 Hear the God Speak</button>
                <button type="button" id="music-btn" class="audio-btn">🎵 Hear the Realm</button>
            </div>
        </div>
        <a href="{{ url_for('home') }}" class="back-link">← Return to the Temple</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="{{ url_for('static', filename='scene.js') }}"></script>
    <script src="{{ url_for('static', filename='dialogue.js') }}"></script>
    <script src="{{ url_for('static', filename='audio.js') }}"></script>
    <script src="{{ url_for('static', filename='destiny.js') }}"></script>
</body>
</html>
