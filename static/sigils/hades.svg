<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Hades: a two-pronged key glyph (Hades' myth association with keys
       and gates), distinct from Poseidon's trident. Hardcoded to the
       gold leaf token; re-export if it changes. -->
  <circle cx="12" cy="12" r="10.5" fill="none" stroke="#bd9548" stroke-width="1" opacity="0.6"/>
  <g fill="none" stroke="#bd9548" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7.5" r="2.6"/>
    <line x1="12" y1="10" x2="12" y2="15.5"/>
    <line x1="12" y1="15.5" x2="9" y2="19"/>
    <line x1="12" y1="15.5" x2="15" y2="19"/>
    <line x1="12" y1="13" x2="14" y2="13"/>
  </g>
</svg>
