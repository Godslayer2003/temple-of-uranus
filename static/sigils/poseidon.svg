  <g fill="none" stroke="#bd9548" stroke-width="1.6" stroke-linecap="round">
    <line x1="12" y1="8" x2="12" y2="19"/>
    <line x1="8.5" y1="10" x2="9.5" y2="7"/>
    <line x1="12" y1="9.5" x2="12" y2="6"/>
    <line x1="15.5" y1="10" x2="14.5" y2="7"/>
  </g>
</svg>
