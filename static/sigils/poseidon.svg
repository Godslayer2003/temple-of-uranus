<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Poseidon: a trident reduced to three ink ticks off one stem —
       manuscript-marginalia simplicity, not a literal 3D prong shape.
       Hardcoded to the gold leaf token; re-export if it changes. -->
